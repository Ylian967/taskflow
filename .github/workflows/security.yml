# ============================================================================
# security.yml : les contrôles de sécurité, à chaque PR et chaque semaine.
#
#   secrets      gitleaks sur tout l'historique Git            secrets commités
#   dependances  npm audit (high / critical), api et front       SCA
#   sast         Semgrep, règles publiques                       code source
#   dast         ZAP baseline contre la stack Compose lancée     application qui tourne
#                dans le job (front sur http://localhost:8080)
#
# S'ajoute à ce qui existe déjà : gitleaks en pre-commit, Trivy dans release.yml,
# Dependabot. Le schedule hebdomadaire rattrape les CVE publiées après le merge :
# une dépendance saine aujourd'hui peut ne plus l'être la semaine prochaine,
# sans que le code ait bougé. Tous les rapports sont publiés en artefacts.
# ============================================================================

name: Sécurité

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # lundi 5h23 UTC (pas une heure ronde : moins d'attente)
  workflow_dispatch:

# Lecture seule : aucun job n'écrit dans le dépôt ni ne commente la PR.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Secrets ---------------------------------------------------------
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique : un secret effacé reste dans les anciens commits
          persist-credentials: false

      # Binaire officiel, vérifié par sa somme SHA-256 avant usage. L'action
      # gitleaks/gitleaks-action demande une licence pour les organisations.
      - name: Installer gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$archive" gitleaks

      - name: Scanner l'historique
        run: ./gitleaks git --redact --verbose --report-format sarif --report-path gitleaks.sarif .

      - name: Rapport gitleaks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-gitleaks
          path: gitleaks.sarif
          if-no-files-found: ignore

  # ---------- Dépendances (SCA) -----------------------------------------------
  dependances:
    name: Dépendances (npm audit) ${{ matrix.dossier }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false # un échec de l'api ne cache pas le résultat du front
      matrix:
        dossier: [api, front]
    defaults:
      run:
        working-directory: ${{ matrix.dossier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # npm audit lit le package-lock.json : pas besoin d'installer.
      # D'abord le rapport complet pour le triage (n'échoue jamais)...
      - name: Rapport complet (JSON)
        run: npm audit --json > npm-audit.json || true

      # ...puis le contrôle bloquant. Les devDependencies comptent : elles
      # tournent dans le CI et au build (le front n'a que des devDependencies).
      - name: Bloquer sur high / critical
        run: npm audit --audit-level=high

      - name: Rapport npm audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-npm-audit-${{ matrix.dossier }}
          path: ${{ matrix.dossier }}/npm-audit.json

  # ---------- Code source (SAST) ----------------------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: docker.io/semgrep/semgrep:1.184.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Règles publiques, sans compte : p/javascript (JS, Express) et
      # p/nodejsscan (XSS, injection SQL, exec, eval...). --error : un seul
      # résultat suffit à faire échouer le job. Un faux positif se neutralise
      # ligne par ligne (// nosemgrep: <règle>) et se justifie dans SECURITE.md.
      - name: Analyse statique
        run: >-
          semgrep scan
          --config p/javascript
          --config p/nodejsscan
          --metrics=off
          --error
          --sarif-output=semgrep.sarif

      - name: Rapport Semgrep
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-semgrep
          path: semgrep.sarif
          if-no-files-found: ignore

  # ---------- Application qui tourne (DAST) -----------------------------------
  dast:
    name: DAST (ZAP baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # La stack de dev (compose.yaml) : db, api et front sur :8080.
      - name: Démarrer TaskFlow
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Vérifier que l'application répond
        run: curl -fsS http://localhost:8080/health

      # Baseline = scan passif : ZAP parcourt le site et analyse les réponses
      # (en-têtes, cookies, fuites d'information) sans envoyer d'attaque.
      # .zap/rules.tsv fixe la décision par règle (FAIL bloque, WARN signale,
      # IGNORE = faux positif justifié). -I : seuls les FAIL font échouer.
      # --network host : ZAP joint localhost:8080 de la machine du job.
      - name: Scan ZAP baseline
        run: |
          mkdir -p zap
          cp .zap/rules.tsv zap/
          chmod -R a+rwx zap # ZAP tourne en uid 1000 dans son conteneur
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py -t http://localhost:8080 \
              -c rules.tsv -I \
              -r zap-rapport.html -J zap-rapport.json -w zap-rapport.md
          cat zap/zap-rapport.md >> "$GITHUB_STEP_SUMMARY"

      - name: Logs de la stack
        if: failure()
        run: docker compose logs --no-color

      - name: Rapport ZAP
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-zap
          path: zap/zap-rapport.*
          if-no-files-found: ignore

      - name: Arrêter la stack
        if: always()
        run: docker compose down -v
