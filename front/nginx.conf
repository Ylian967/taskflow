# Configuration Nginx du conteneur "front".
# Rôle : (1) servir le site compilé, (2) transmettre /api et /health à l'API.
# C'est ce "reverse proxy" qui remplace le proxy de Vite utilisé en développement.
#
# Ce fichier est un "template" : ${NGINX_LOCAL_RESOLVERS} est remplacé au démarrage
# du conteneur par l'adresse du serveur DNS du réseau Docker (voir Dockerfile).

# Ce fichier est inclus dans le bloc http {} de l'image nginx : on peut y déclarer un map.
#
# Cache-Control selon le chemin, calculé ici plutôt qu'avec un add_header dans
# "location /assets/" : add_header N'EST PAS HÉRITÉ. Une location qui a son
# propre add_header perd tous ceux du niveau server, CSP comprise.
map $uri $taskflow_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";  # nom avec hash : cache 1 an
    default     "no-cache";                              # index.html : toujours revalidé
}

server {
    listen 80;
    server_name _;

    # --- En-têtes de sécurité (étape 5) -------------------------------------
    # "always" : posés aussi sur les erreurs (404, 502), pas seulement sur les 200.

    # Ne pas annoncer la version de Nginx (en-tête Server, pages d'erreur).
    server_tokens off;

    # CSP : seules les ressources de notre origine. Le build Vite n'a ni script ni
    # style inline (un .js et un .css dans /assets/), donc pas de 'unsafe-inline'.
    # connect-src 'self' : le front n'appelle que /api sur la même origine.
    # frame-ancestors 'none' : la page ne peut pas être affichée dans une iframe.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Le navigateur ne devine pas le type d'un fichier (un .txt exécuté comme script).
    add_header X-Content-Type-Options "nosniff" always;
    # Anti-clickjacking pour les navigateurs qui ignorent frame-ancestors.
    add_header X-Frame-Options "DENY" always;
    # L'URL complète n'est pas transmise aux autres sites.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Fonctions du navigateur dont TaskFlow n'a pas besoin : interdites.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Isolation entre origines (attaques de type Spectre).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control $taskflow_cache_control;

    # Les réponses de l'API contiennent "X-Powered-By: Express" : on le retire.
    proxy_hide_header X-Powered-By;

    root /usr/share/nginx/html;
    index index.html;

    # DNS utilisé pour retrouver l'adresse du service "api". valid=10s : on
    # re-demande l'adresse toutes les 10 s. Sans cela, Nginx mémoriserait l'IP de l'API
    # une fois pour toutes : après un redéploiement de l'API (nouveau conteneur, donc
    # parfois nouvelle IP), il enverrait ses requêtes dans le vide -> erreur 502.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    # Le nom "api" est celui du service dans compose.yaml : le réseau Docker le résout.
    # On le met dans une variable pour que Nginx le résolve à chaque requête
    # (et pas une seule fois au démarrage).
    set $api_upstream http://api:3000;

    # Les appels /api/... partent vers l'API (le chemin est transmis tel quel).
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /health aussi : pratique pour le smoke test et la supervision depuis l'extérieur.
    location = /health {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Tout le reste : les fichiers du site. Si le fichier n'existe pas, on renvoie
    # index.html (utile pour les applications à une seule page).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers générés par Vite ont un nom contenant un hash : ils peuvent être
    # gardés très longtemps en cache (Cache-Control posé par le map en haut).
    # Pas d'add_header ici (les en-têtes de sécurité disparaîtraient), ni
    # d'"expires" (il ajouterait un second Cache-Control). Fichier absent : 404.
    location /assets/ {
        try_files $uri =404;
    }
}
