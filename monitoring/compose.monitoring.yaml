# ============================================================================
# Supervision de la production TaskFlow.
#
#   docker compose -f compose.monitoring.yaml up -d
#
# Prometheus et blackbox rejoignent le réseau de la prod (taskflow-prod) pour
# joindre api:3000/metrics et front/health sans rien exposer de plus.
# Tous les ports sont publiés sur 127.0.0.1 : rien n'est joignable depuis le
# réseau local.
#   Prometheus   http://localhost:9090
#   Alertmanager http://localhost:9093
#   Mailpit      http://localhost:8025   (les mails d'alerte)
#   Grafana      http://localhost:3001   (admin / GRAFANA_ADMIN_PASSWORD)
# ============================================================================

name: taskflow-monitoring

services:
  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle # rechargement de la config : POST /-/reload
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/tests:/etc/prometheus/tests:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [default, taskflow]
    restart: unless-stopped

  blackbox:
    image: docker.io/prom/blackbox-exporter:v0.27.0
    command: --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [default, taskflow]
    restart: unless-stopped

  alertmanager:
    image: docker.io/prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  mailpit:
    image: docker.io/axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD manquant}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/taskflow-red.json
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  # Réseau créé par compose.prod.yaml : la prod doit tourner avant la supervision.
  taskflow:
    name: taskflow-prod
    external: true
