global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # /metrics de l'API, joint par le réseau de la prod (jamais exposé dehors).
  - job_name: taskflow-api
    static_configs:
      - targets: ["api:3000"]
        labels:
          env: prod

  # Sonde « comme un utilisateur » : /health à travers le Nginx du front.
  # La cible devient le paramètre ?target= et la requête part vers blackbox.
  - job_name: blackbox-health
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets: ["http://front/health"]
        labels:
          env: prod
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Les métriques de blackbox lui-même (sondes en cours, erreurs de config).
  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]
